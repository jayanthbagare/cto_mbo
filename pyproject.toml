[project]
name = "cto-order-agent"
version = "0.1.0"
description = "MTO/CTO Sales Order and Production Order Intelligence Agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "structlog>=24.1",
]

[project.optional-dependencies]
a2a = ["a2a-sdk>=1.0"]
mcp = ["mcp>=2.0"]
otel = ["opentelemetry-sdk>=1.25"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "jsonschema>=4.22",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cto_order_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["cto_order_agent"]
mypy_path = "src"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"
markers = [
    "unit: fast unit tests",
    "contract: interface and schema contract tests",
    "integration: end-to-end conversational tests",
    "eval: scenario corpus evaluation",
]

[tool.coverage.run]
source = ["cto_order_agent"]
branch = true

[tool.coverage.report]
show_missing = true
