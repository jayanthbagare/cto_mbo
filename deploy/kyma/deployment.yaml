apiVersion: apps/v1
kind: Deployment
metadata:
  name: cto-order-agent
  labels:
    app: cto-order-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cto-order-agent
  template:
    metadata:
      labels:
        app: cto-order-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: agent
          image: cto-order-agent:0.1.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: cto-order-agent-config
            - secretRef:
                name: cto-order-agent-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: "1"
